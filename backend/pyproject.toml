[project]
name = "portal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.6.0",
    "openai>=2.46.0",
    "pydantic-settings>=2.12.0",
    "slowapi>=0.1.9",
    "supabase>=2.27.2",
    "pypdf>=6.14.2",
    "langchain-text-splitters>=1.1.0",
    "python-multipart>=0.0.30",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.7.0",
    "pyright>=1.1.411",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = ["error"]
# Dump tracebacks if any test hangs past this many seconds so a stuck stream /
# to_thread mock surfaces in CI instead of silently blocking the run.
faulthandler_timeout = 60

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true
