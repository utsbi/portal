name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
  NEXT_PUBLIC_SITE_URL: https://placeholder.invalid
  BACKEND_URL: https://placeholder.invalid
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  SUPABASE_SECRET_KEY: placeholder-secret-key
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  N8N_CONTACT_WEBHOOK_URL: https://placeholder.invalid/webhook
  BASIC_AUTH_USER: ci
  BASIC_AUTH_PASSWORD: ci
  EMAIL_TIME_ZONE: America/Chicago

jobs:
  frontend-quality:
    name: Frontend (lint, types, unit, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check (Biome)
        run: bun run lint

      - name: Typecheck (TypeScript)
        run: bun run typecheck

      - name: Unit and integration tests with coverage
        run: bun run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

  frontend-browser:
    name: Frontend (production build, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production application
        run: bun run build

      - name: Assemble standalone production server
        run: |
          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser tests against production build
        run: bun run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend (tests, coverage, lint, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies and verify lockfile
        run: uv sync --frozen

      - name: Compile check
        run: uv run python -W error -m compileall -q app

      - name: Tests with branch coverage
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Lint (Ruff)
        run: uv run ruff check . --output-format=github

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Typecheck (Pyright)
        run: uv run pyright

      - name: Upload backend coverage
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  database:
    name: Database (pgTAP RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run pgTAP RLS suite
        run: bash supabase/tests/run.sh
