name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Describe the problem first, then the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who is it for?
      placeholder: As a <user>, I want <goal> so that <reason>.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the portal would this touch?
      options:
        - Frontend (Next.js / dashboard / public pages)
        - Backend (FastAPI / AI portal)
        - Supabase (auth / database / RLS)
        - Infra / deploy (Vercel / Docker / VPS)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is preferred.
    validations:
      required: false
