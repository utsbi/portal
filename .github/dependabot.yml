# Dependabot configuration.
# Keep dependency metadata available to GitHub's dependency graph and alerts,
# but do not open scheduled version-update pull requests. Dependency upgrades
# are handled as deliberate, consolidated maintenance passes after local CI.
#
# Automatic Dependabot security-fix PRs are disabled in the repository's
# Advanced Security settings; vulnerability alerts remain enabled.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
